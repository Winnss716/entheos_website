<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Entheos Veteran Project</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --gold:#c8aa5a; --gold-light:#e2c97e; --cream:#f5f0e8; --charcoal:#1c1e1a; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--charcoal); color:var(--cream); font-family:'Barlow',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
    .brand { font-family:'Bebas Neue',sans-serif; font-size:2.4rem; letter-spacing:0.12em; color:var(--gold); margin-bottom:6px; }
    .brand-sub { font-size:0.75rem; letter-spacing:0.22em; text-transform:uppercase; color:rgba(245,240,232,0.35); margin-bottom:36px; }
    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(200,170,90,0.25); border-radius:6px; padding:40px 44px; width:100%; max-width:420px; }
    .card h2 { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:0.1em; color:var(--gold); margin-bottom:20px; }
    .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .form-group label { font-size:0.68rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:rgba(245,240,232,0.5); }
    .field { background:rgba(255,255,255,0.06); border:1px solid rgba(200,170,90,0.25); border-radius:4px; padding:13px 16px; color:var(--cream); font-family:'Barlow',sans-serif; font-size:0.95rem; outline:none; transition:border-color 0.2s; }
    .field:focus { border-color:var(--gold); }
    .field::placeholder { color:rgba(245,240,232,0.25); }
    .btn { width:100%; background:var(--gold); color:var(--charcoal); border:none; border-radius:4px; padding:14px; font-family:'Barlow',sans-serif; font-size:0.88rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.2s; margin-top:6px; }
    .btn:hover { background:var(--gold-light); }
    .btn:disabled { opacity:0.5; cursor:default; }
    .msg { font-size:0.82rem; margin-top:14px; text-align:center; padding:12px 16px; border-radius:4px; display:none; }
    .msg.err { background:rgba(224,112,112,0.1); border:1px solid rgba(224,112,112,0.3); color:#e07070; }
    .msg.ok  { background:rgba(90,170,110,0.1);  border:1px solid rgba(90,170,110,0.3);  color:#5aaa6e; }
  </style>
</head>
<body>
  <div class="brand">ENTHEOS</div>
  <div class="brand-sub">Veteran Project — Reset Password</div>
  <div class="card">
    <h2>Set New Password</h2>
    <div id="reset-form">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" class="field" id="rp-pass" placeholder="At least 6 characters"/>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" class="field" id="rp-pass2" placeholder="Repeat password" onkeydown="if(event.key==='Enter')doReset()"/>
      </div>
      <button class="btn" id="rp-btn" onclick="doReset()">Reset Password</button>
      <div class="msg" id="rp-msg"></div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://uymvnusvxjyeceuujbvv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_HLcANcarEFrvpbSi4n4_NA_QauDk0tS';
  const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
  }

  // Supabase sends recovery tokens in the URL hash: #access_token=...&type=recovery
  window.addEventListener('DOMContentLoaded', async () => {
    const hash = new URLSearchParams(window.location.hash.replace('#', ''));
    const accessToken = hash.get('access_token');
    const refreshToken = hash.get('refresh_token');
    const type = hash.get('type');

    if (type !== 'recovery' || !accessToken) {
      document.getElementById('reset-form').innerHTML =
        '<div class="msg err" style="display:block;">Invalid or missing reset link. <a href="account.html" style="color:#e07070;">Go back</a></div>';
      return;
    }

    // Establish the session from the recovery token
    const { error } = await _sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    if (error) {
      document.getElementById('reset-form').innerHTML =
        '<div class="msg err" style="display:block;">Reset link has expired. <a href="account.html" style="color:#e07070;">Request a new one</a></div>';
    }
  });

  async function doReset() {
    const pass  = document.getElementById('rp-pass').value;
    const pass2 = document.getElementById('rp-pass2').value;
    if (!pass)          { showMsg('rp-msg', 'Please enter a new password.', 'err'); return; }
    if (pass !== pass2) { showMsg('rp-msg', 'Passwords do not match.', 'err'); return; }
    if (pass.length < 6){ showMsg('rp-msg', 'Password must be at least 6 characters.', 'err'); return; }

    const btn = document.getElementById('rp-btn');
    btn.disabled = true; btn.textContent = 'Resetting…';

    const { error } = await _sb.auth.updateUser({ password: pass });
    btn.disabled = false; btn.textContent = 'Reset Password';

    if (error) {
      showMsg('rp-msg', error.message || 'Reset failed. The link may have expired.', 'err');
    } else {
      showMsg('rp-msg', 'Password updated! Redirecting to login…', 'ok');
      btn.style.display = 'none';
      await _sb.auth.signOut();
      setTimeout(() => window.location.href = 'account.html', 2000);
    }
  }
</script>
</body>
</html>
